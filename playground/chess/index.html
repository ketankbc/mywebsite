<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Complete Chess</title>
<style>
:root{--bg:#0f172a;--panel:#182338;--panel2:#24334e;--text:#f8fafc;--muted:#a8b3c7;--light:#f0d9b5;--dark:#8b5a2b;--white:#fff;--black:#111827;--board:min(82vw,74vh,680px)}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:18px;display:grid;place-items:center;color:var(--text);background:radial-gradient(circle at 15% 0,#263d6f,transparent 34%),radial-gradient(circle at 90% 95%,#174b45,transparent 30%),var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}.app{width:min(1160px,100%);display:grid;grid-template-columns:auto 330px;gap:22px;align-items:start}.card{border:1px solid #ffffff17;background:#182338ed;border-radius:22px;box-shadow:0 24px 70px #0006}.board-card{padding:14px}.player-bar{min-height:48px;padding:7px 3px;display:flex;align-items:center;justify-content:space-between;gap:10px}.player-info{display:flex;align-items:center;gap:9px}.avatar{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:var(--panel2);font-size:23px}.player-name{font-weight:800}.player-detail,.note{font-size:12px;color:var(--muted)}.captured{min-height:24px;font:19px "Segoe UI Symbol";letter-spacing:1px}.board{width:var(--board);height:var(--board);display:grid;grid-template:repeat(8,1fr)/repeat(8,1fr);overflow:hidden;border-radius:12px;box-shadow:0 13px 35px #0006;touch-action:manipulation;user-select:none}.square{position:relative;display:grid;place-items:center;border:0;padding:0;background:var(--light);cursor:pointer}.square.dark{background:var(--dark)}.square.last:before,.square.selected:before,.square.check:before{content:"";position:absolute;inset:0;pointer-events:none}.square.last:before{background:#60a5fa66}.square.selected:before{box-shadow:inset 0 0 0 5px #fbbf24}.square.check:before{background:#ef444499}.piece{position:relative;z-index:2;font:calc(var(--board)/10.3) "Segoe UI Symbol","Noto Sans Symbols 2",sans-serif;line-height:1;filter:drop-shadow(0 2px 1px #0006);transform:rotate(0);transition:transform .18s}.piece.white{color:var(--white);-webkit-text-stroke:1.25px #111827}.piece.black{color:var(--black);-webkit-text-stroke:1px #f8fafc}body.auto-flip.player-two-turn .piece{transform:rotate(180deg)}.dot,.ring{position:absolute;z-index:3;pointer-events:none}.dot{width:24%;height:24%;border-radius:50%;background:#0f172a66}.ring{inset:7%;border:calc(var(--board)/75) solid #0f172a66;border-radius:50%}.coord{position:absolute;z-index:4;font-size:11px;font-weight:900;opacity:.78}.coord.file{right:4px;bottom:2px}.coord.rank{left:4px;top:2px}.dark .coord{color:var(--light)}.square:not(.dark) .coord{color:var(--dark)}.sidebar{padding:19px;display:flex;flex-direction:column;gap:14px}h1,h2{margin:0}.subtitle{color:var(--muted);font-size:13px;margin:3px 0 0}.status{padding:13px;border-radius:13px;background:var(--panel2);border-left:4px solid #3b82f6;font-weight:750}.status.danger{border-color:#ef4444}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{padding:11px;border:1px solid #ffffff19;border-radius:11px;color:#fff;background:#2a3c5c;font-weight:750;cursor:pointer}.btn.primary{background:#2563eb}.btn.on{background:#0f766e}.btn.off{background:#475569}.historybox{min-height:190px;overflow:hidden;border-radius:14px;background:#0f172a77}.section-title{padding:11px 13px;border-bottom:1px solid #ffffff12;color:var(--muted);font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}.history{max-height:260px;overflow:auto;padding:8px}.move-row{display:grid;grid-template-columns:32px 1fr 1fr;gap:5px;padding:6px 8px}.move-row:nth-child(odd){background:#ffffff08}.empty{padding:20px;text-align:center;color:var(--muted)}.modal{position:fixed;inset:0;z-index:30;display:none;place-items:center;padding:16px;background:#030712d8;backdrop-filter:blur(6px)}.modal.open{display:grid}.dialog{width:min(500px,100%);max-height:95vh;overflow:auto;padding:22px;border:1px solid #ffffff1f;border-radius:20px;background:#182338;box-shadow:0 25px 80px #0009}.settings{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}label{font-size:12px;color:var(--muted);font-weight:750}input,select{width:100%;padding:10px;border:1px solid #ffffff25;border-radius:10px;color:#fff;background:#253654}input[type=color]{height:43px;padding:4px}.checkline{display:flex;gap:9px;align-items:center;padding:10px;background:#0f172a55;border-radius:10px}.checkline input{width:auto}.promo{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.promo button{aspect-ratio:1;border:0;border-radius:13px;color:#fff;background:#2a3c5c;font:48px "Segoe UI Symbol"}.hidden{display:none!important}.resume-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
#board:fullscreen{width:100vw;height:100vh;border-radius:0;background:#000}#board:-webkit-full-screen{width:100vw;height:100vh;border-radius:0;background:#000}
@media(max-width:930px){:root{--board:min(94vw,680px)}body{padding:8px}.app{grid-template-columns:1fr;justify-items:center}.board-card,.sidebar{width:min(100%,708px)}}@media(max-width:520px){.board-card{padding:6px}.settings{grid-template-columns:1fr}.field.full{grid-column:auto}.piece{font-size:calc(var(--board)/9.8)}}

.home-link{position:fixed;top:12px;left:12px;z-index:25;display:inline-flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid #ffffff24;border-radius:999px;background:#0f172acc;color:#f8fafc;text-decoration:none;font:700 12px Inter,system-ui,-apple-system,"Segoe UI",sans-serif;backdrop-filter:blur(9px);box-shadow:0 8px 24px #0004}.home-link:hover{background:#24334e}.home-link span{color:#60a5fa}@media(max-width:520px){.home-link{top:7px;left:7px;padding:7px 10px;font-size:10px}}
</style>
</head>
<body>
<a class="home-link" href="../../index.html#about" aria-label="Back to Ketan Chavan website"><span>←</span> Ketan / Playground</a>
<main class="app"><section class="card board-card"><div id="top" class="player-bar"></div><div id="board" class="board"></div><div id="bottom" class="player-bar"></div></section><aside class="card sidebar"><header><h1>Complete Chess</h1><p id="modeText" class="subtitle">Choose a game mode</p></header><div id="status" class="status">Ready</div><div class="controls"><button id="newBtn" class="btn primary">New game</button><button id="undoBtn" class="btn">Undo</button><button id="fullBtn" class="btn">Full screen</button><button id="manualFlipBtn" class="btn">Flip board</button><button id="autoFlipBtn" class="btn on">Auto flip: On</button><button id="soundBtn" class="btn on">Sound: On</button></div><section class="historybox"><div class="section-title">Move history</div><div id="history" class="history"></div></section><div class="note">Games are saved automatically in this browser after every move.</div></aside></main>
<div id="setupModal" class="modal"><div class="dialog"><h2>Game setup</h2><p class="note">Names are optional.</p><div class="settings"><div class="field full"><label>Mode</label><select id="mode"><option value="ai">Single player vs computer</option><option value="local">Two players on this iPad</option></select></div><div class="field"><label>Player 1</label><input id="p1" placeholder="Player 1"></div><div id="p2Field" class="field"><label>Player 2</label><input id="p2" placeholder="Player 2"></div><div id="humanField" class="field"><label>Your army</label><select id="human"><option value="w">White</option><option value="b">Black</option><option value="random">Random</option></select></div><div id="difficultyField" class="field"><label>Difficulty</label><select id="difficulty"><option value="1">Easy</option><option value="2" selected>Medium</option><option value="3">Hard</option></select></div><div id="autoField" class="field full"><label class="checkline"><input id="autoSetup" type="checkbox" checked> Auto flip all pieces during Player 2's turn</label></div><div class="field"><label>Light squares</label><input id="light" type="color" value="#f0d9b5"></div><div class="field"><label>Dark squares</label><input id="dark" type="color" value="#8b5a2b"></div><div class="field"><label>White army</label><input id="white" type="color" value="#ffffff"></div><div class="field"><label>Black army</label><input id="black" type="color" value="#111827"></div></div><button id="startBtn" class="btn primary" style="width:100%">Start game</button></div></div>
<div id="resumeModal" class="modal"><div class="dialog"><h2>Resume saved game?</h2><p id="resumeText" class="note">A saved game was found in this browser.</p><div class="resume-actions"><button id="resumeBtn" class="btn primary">Resume game</button><button id="freshBtn" class="btn">New game</button></div></div></div>
<div id="promotionModal" class="modal"><div class="dialog" style="max-width:390px;text-align:center"><h2>Choose promotion</h2><div id="promo" class="promo"></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script>
(function(){'use strict';
var KEY='completeChessSavedGameV1',game=new Chess(),selected=null,legal=[],pending=null,thinking=false,audio=null,orientation='w';var cfg={mode:'ai',p1:'Player 1',p2:'Computer',human:'w',difficulty:2,autoFlip:true,sound:true,light:'#f0d9b5',dark:'#8b5a2b',white:'#ffffff',black:'#111827'};var glyph={w:{k:'♔',q:'♕',r:'♖',b:'♗',n:'♘',p:'♙'},b:{k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'}},names={k:'king',q:'queen',r:'rook',b:'bishop',n:'knight',p:'pawn'},initial={q:1,r:2,b:2,n:2,p:8};function $(id){return document.getElementById(id)}
function setupFields(){var local=$('mode').value==='local';$('p2Field').classList.toggle('hidden',!local);$('humanField').classList.toggle('hidden',local);$('difficultyField').classList.toggle('hidden',local);$('autoField').classList.toggle('hidden',!local)}
function applyColors(){document.documentElement.style.setProperty('--light',cfg.light);document.documentElement.style.setProperty('--dark',cfg.dark);document.documentElement.style.setProperty('--white',cfg.white);document.documentElement.style.setProperty('--black',cfg.black)}
function sqs(){var f=orientation==='w'?'abcdefgh':'hgfedcba',r=orientation==='w'?[8,7,6,5,4,3,2,1]:[1,2,3,4,5,6,7,8],a=[];for(var y=0;y<8;y++)for(var x=0;x<8;x++)a.push(f[x]+r[y]);return a}
function checkedKing(){if(!game.in_check())return null;for(var r=1;r<=8;r++)for(var f=0;f<8;f++){var s='abcdefgh'[f]+r,p=game.get(s);if(p&&p.color===game.turn()&&p.type==='k')return s}return null}
function flipState(){var active=cfg.mode==='local'&&cfg.autoFlip;document.body.classList.toggle('auto-flip',active);document.body.classList.toggle('player-two-turn',active&&game.turn()==='b');$('autoFlipBtn').textContent='Auto flip: '+(cfg.autoFlip?'On':'Off');$('autoFlipBtn').classList.toggle('on',cfg.autoFlip);$('autoFlipBtn').classList.toggle('off',!cfg.autoFlip)}
function render(){flipState();var b=$('board'),h=game.history({verbose:true}),last=h.length?h[h.length-1]:null,ck=checkedKing();b.innerHTML='';sqs().forEach(function(s,i){var p=game.get(s),x=s.charCodeAt(0)-97,y=Number(s[1]),el=document.createElement('button'),lm=null;for(var z=0;z<legal.length;z++)if(legal[z].to===s){lm=legal[z];break}el.className='square'+((x+y)%2===1?' dark':'')+(selected===s?' selected':'')+(last&&(last.from===s||last.to===s)?' last':'')+(ck===s?' check':'');if(p){var pc=document.createElement('span');pc.className='piece '+(p.color==='w'?'white':'black');pc.textContent=glyph[p.color][p.type];el.appendChild(pc)}if(lm){var m=document.createElement('span');m.className=p||lm.flags.indexOf('e')>=0?'ring':'dot';el.appendChild(m)}if(Math.floor(i/8)===7){var fc=document.createElement('span');fc.className='coord file';fc.textContent=s[0];el.appendChild(fc)}if(i%8===0){var rc=document.createElement('span');rc.className='coord rank';rc.textContent=s[1];el.appendChild(rc)}el.onclick=function(){clickSquare(s)};b.appendChild(el)});status();history();players()}
function canMove(){return !thinking&&!game.game_over()&&(cfg.mode==='local'||game.turn()===cfg.human)}function clickSquare(s){if(!canMove()||pending)return;var p=game.get(s);if(selected){var c=legal.filter(function(m){return m.to===s});if(c.length){if(c.some(function(m){return !!m.promotion})){promotion(selected,s);return}makeMove({from:selected,to:s});return}}if(p&&p.color===game.turn()){selected=s;legal=game.moves({square:s,verbose:true})}else{selected=null;legal=[]}render()}
function makeMove(data){var result=game.move(data);if(!result)return;selected=null;legal=[];pending=null;$('promotionModal').classList.remove('open');if(result.captured)captureSound();if(game.in_check())checkSound();save();render();if(cfg.mode==='ai'&&!game.game_over()&&game.turn()!==cfg.human){thinking=true;status();setTimeout(computerMove,320)}}
function promotion(from,to){pending={from:from,to:to};var box=$('promo');box.innerHTML='';['q','r','b','n'].forEach(function(t){var el=document.createElement('button');el.textContent=glyph[game.turn()][t];el.onclick=function(){makeMove({from:from,to:to,promotion:t})};box.appendChild(el)});$('promotionModal').classList.add('open')}
function value(){var v={p:100,n:320,b:330,r:500,q:900,k:20000},score=0;for(var r=1;r<=8;r++)for(var f=0;f<8;f++){var p=game.get('abcdefgh'[f]+r);if(p)score+=(p.color==='w'?1:-1)*v[p.type]}return score}function minimax(d,a,b){if(d===0||game.game_over())return value();var ms=game.moves({verbose:true}),max=game.turn()==='w',best=max?-Infinity:Infinity;for(var i=0;i<ms.length;i++){game.move(ms[i]);var s=minimax(d-1,a,b);game.undo();if(max){best=Math.max(best,s);a=Math.max(a,best)}else{best=Math.min(best,s);b=Math.min(b,best)}if(b<=a)break}return best}
function computerMove(){var ms=game.moves({verbose:true}),best=[],bestScore=game.turn()==='w'?-Infinity:Infinity;if(!ms.length){thinking=false;render();return}for(var i=0;i<ms.length;i++){var m=ms[i];game.move(m);var s=minimax(cfg.difficulty-1,-Infinity,Infinity);game.undo();var better=game.turn()==='w'?s>bestScore:s<bestScore;if(better){bestScore=s;best=[m]}else if(s===bestScore)best.push(m)}var chosen=best[Math.floor(Math.random()*best.length)],result=game.move({from:chosen.from,to:chosen.to,promotion:chosen.promotion||'q'});thinking=false;if(result.captured)captureSound();if(game.in_check())checkSound();save();render()}
function playerName(c){if(cfg.mode==='ai')return c===cfg.human?cfg.p1:'Computer';return c==='w'?cfg.p1:cfg.p2}function status(){var c=game.turn(),now=playerName(c),winner=playerName(c==='w'?'b':'w'),text=thinking?'Computer is thinking...':now+' to play',danger=false;if(game.in_checkmate()){text='Checkmate. '+winner+' wins!';danger=true}else if(game.in_stalemate())text='Draw by stalemate.';else if(game.insufficient_material())text='Draw by insufficient material.';else if(game.in_threefold_repetition())text='Draw by threefold repetition.';else if(Number(game.fen().split(' ')[4])>=100)text='Draw by the 50-move rule.';else if(game.in_draw())text='Draw.';else if(game.in_check()){text=now+' is in check';danger=true}$('status').textContent=text;$('status').classList.toggle('danger',danger)}
function history(){var h=game.history(),box=$('history');if(!h.length){box.innerHTML='<div class="empty">No moves yet.</div>';return}box.innerHTML='';for(var i=0;i<h.length;i+=2)box.innerHTML+='<div class="move-row"><span>'+(i/2+1)+'.</span><span>'+(h[i]||'')+'</span><span>'+(h[i+1]||'')+'</span></div>';box.scrollTop=box.scrollHeight}
function captured(){var cur={w:{q:0,r:0,b:0,n:0,p:0},b:{q:0,r:0,b:0,n:0,p:0}},out={w:[],b:[]};for(var r=1;r<=8;r++)for(var f=0;f<8;f++){var p=game.get('abcdefgh'[f]+r);if(p&&p.type!=='k')cur[p.color][p.type]++}['w','b'].forEach(function(c){['q','r','b','n','p'].forEach(function(t){for(var i=cur[c][t];i<initial[t];i++)out[c].push(glyph[c][t])})});return out}function playerHtml(c,pos){var cap=captured(),op=c==='w'?'b':'w';return '<div class="player-info"><div class="avatar">'+glyph[c].k+'</div><div><div class="player-name">'+playerName(c)+(game.turn()===c?' •':'')+'</div><div class="player-detail">'+(c==='w'?'White':'Black')+' · '+pos+'</div></div></div><div class="captured">'+cap[op].join('')+'</div>'}function players(){var top=orientation==='w'?'b':'w';$('top').innerHTML=playerHtml(top,'top');$('bottom').innerHTML=playerHtml(orientation,'bottom')}
function tone(a,b,d,t,v){if(!cfg.sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();var o=audio.createOscillator(),g=audio.createGain();o.type=t;o.frequency.setValueAtTime(a,audio.currentTime);o.frequency.exponentialRampToValueAtTime(b,audio.currentTime+d);g.gain.setValueAtTime(v,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}function captureSound(){tone(190,95,.14,'square',.11)}function checkSound(){setTimeout(function(){tone(660,440,.22,'triangle',.16)},70)}
function save(){try{localStorage.setItem(KEY,JSON.stringify({pgn:game.pgn(),cfg:cfg,orientation:orientation,savedAt:new Date().toISOString()}))}catch(e){}}function clearSave(){try{localStorage.removeItem(KEY)}catch(e){}}function getSave(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function loadSaved(data){cfg=data.cfg||cfg;orientation=data.orientation||'w';game.reset();if(data.pgn&&!game.load_pgn(data.pgn)){clearSave();$('setupModal').classList.add('open');return}applyColors();$('modeText').textContent=cfg.mode==='ai'?cfg.p1+' vs Computer · '+['','Easy','Medium','Hard'][cfg.difficulty]:cfg.p1+' vs '+cfg.p2+' · Local two-player';$('autoFlipBtn').classList.toggle('hidden',cfg.mode!=='local');$('soundBtn').textContent='Sound: '+(cfg.sound?'On':'Off');$('resumeModal').classList.remove('open');render();if(cfg.mode==='ai'&&!game.game_over()&&game.turn()!==cfg.human){thinking=true;status();setTimeout(computerMove,400)}}
function start(){clearSave();game.reset();cfg.mode=$('mode').value;cfg.p1=$('p1').value.trim()||'Player 1';cfg.p2=cfg.mode==='local'?($('p2').value.trim()||'Player 2'):'Computer';var h=$('human').value;cfg.human=h==='random'?(Math.random()<.5?'w':'b'):h;cfg.difficulty=Number($('difficulty').value);cfg.autoFlip=$('autoSetup').checked;cfg.light=$('light').value;cfg.dark=$('dark').value;cfg.white=$('white').value;cfg.black=$('black').value;orientation=cfg.mode==='ai'?cfg.human:'w';selected=null;legal=[];pending=null;thinking=false;applyColors();$('setupModal').classList.remove('open');$('modeText').textContent=cfg.mode==='ai'?cfg.p1+' vs Computer · '+['','Easy','Medium','Hard'][cfg.difficulty]:cfg.p1+' vs '+cfg.p2+' · Local two-player';$('autoFlipBtn').classList.toggle('hidden',cfg.mode!=='local');save();render();if(cfg.mode==='ai'&&cfg.human==='b'){thinking=true;status();setTimeout(computerMove,400)}}
function fullscreen(){var el=$('board');if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}else{var request=el.requestFullscreen||el.webkitRequestFullscreen;if(request)request.call(el)}}
$('mode').onchange=setupFields;$('startBtn').onclick=start;$('newBtn').onclick=function(){$('setupModal').classList.add('open');setupFields()};$('undoBtn').onclick=function(){if(thinking)return;if(cfg.mode==='ai'){game.undo();game.undo()}else game.undo();selected=null;legal=[];save();render()};$('fullBtn').onclick=fullscreen;$('manualFlipBtn').onclick=function(){orientation=orientation==='w'?'b':'w';save();render()};$('autoFlipBtn').onclick=function(){cfg.autoFlip=!cfg.autoFlip;$('autoSetup').checked=cfg.autoFlip;save();render()};$('soundBtn').onclick=function(){cfg.sound=!cfg.sound;$('soundBtn').textContent='Sound: '+(cfg.sound?'On':'Off');save()};$('resumeBtn').onclick=function(){loadSaved(getSave())};$('freshBtn').onclick=function(){clearSave();$('resumeModal').classList.remove('open');$('setupModal').classList.add('open');setupFields()};setupFields();var saved=getSave();if(saved&&saved.pgn!==undefined){$('resumeText').textContent='Saved game: '+(saved.cfg?saved.cfg.p1:'Player 1')+' vs '+(saved.cfg?saved.cfg.p2:'Player 2');$('resumeModal').classList.add('open')}else $('setupModal').classList.add('open');render();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101417">

  <title>Shared Clipboard | Ketan Playground</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --ink: #101417;
      --paper: #f5f7f2;
      --panel: #ffffff;
      --line: #dfe5dd;
      --muted: #6c7774;
      --accent: #d4fa69;
      --accent-dark: #6f8d28;
      --danger: #a43d32;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      background: linear-gradient(145deg, #f8faf5, #eef2eb);
      color: var(--ink);
      font-family: Manrope, system-ui, sans-serif;
    }

    button,
    textarea,
    input {
      font: inherit;
    }

    .wrap {
      width: min(900px, calc(100% - 32px));
      margin: 0 auto;
      padding: 26px 0 54px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      margin-bottom: 28px;
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--ink);
      text-decoration: none;
      font-size: 12px;
      font-weight: 800;
    }

    .badge {
      font: 500 9px "DM Mono", monospace;
      letter-spacing: .12em;
      color: var(--accent-dark);
    }

    .card {
      background: rgba(255,255,255,.92);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 24px 70px rgba(16,20,23,.09);
      overflow: hidden;
    }

    .head {
      padding: 26px 28px 22px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: flex-start;
    }

    h1 {
      font-size: clamp(32px, 6vw, 54px);
      letter-spacing: -.065em;
      line-height: .95;
      margin: 6px 0 10px;
    }

    .sub {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
      padding: 8px 10px;
      background: #eef3e7;
      border-radius: 999px;
      font: 500 9px "DM Mono", monospace;
      color: #536344;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #9da6a3;
    }

    .body {
      padding: 24px 28px 28px;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 10px;
    }

    .meta {
      font: 500 10px "DM Mono", monospace;
      color: #7a8581;
    }

    textarea {
      width: 100%;
      min-height: 360px;
      resize: vertical;
      padding: 18px;
      border: 1px solid #d5ddd3;
      border-radius: 12px;
      outline: none;
      background: #fbfcfa;
      color: var(--ink);
      font: 14px/1.7 "DM Mono", monospace;
      transition: border-color .18s, box-shadow .18s;
    }

    textarea:focus {
      border-color: #9ab64f;
      box-shadow: 0 0 0 4px rgba(212,250,105,.28);
    }

    textarea::placeholder {
      color: #a0aaa6;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    .btn {
      border: 1px solid #d5ddd3;
      background: #fff;
      color: var(--ink);
      padding: 11px 15px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn.primary {
      background: var(--ink);
      border-color: var(--ink);
      color: #fff;
    }

    .btn.primary span {
      color: var(--accent);
    }

    .btn.danger {
      color: var(--danger);
    }

    .notice {
      margin-top: 14px;
      min-height: 20px;
      font-size: 11px;
      color: var(--muted);
    }

    .notice.ok {
      color: #5f7724;
    }

    .notice.error {
      color: var(--danger);
    }

    .hidden {
      display: none !important;
    }

    .lock-screen {
      padding: 50px 28px 56px;
      text-align: center;
    }

    .lock-icon {
      width: 58px;
      height: 58px;
      margin: 0 auto 20px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--ink);
      color: var(--accent);
      font-size: 25px;
    }

    .lock-screen h2 {
      margin: 0 0 8px;
      font-size: 28px;
      letter-spacing: -.05em;
    }

    .lock-screen p {
      margin: 0 auto 20px;
      max-width: 410px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    .unlock-form {
      width: min(360px, 100%);
      margin: 0 auto;
    }

    .unlock-form input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d5ddd3;
      border-radius: 9px;
      outline: none;
      margin-bottom: 10px;
      text-align: center;
    }

    .unlock-form input:focus {
      border-color: #9ab64f;
      box-shadow: 0 0 0 4px rgba(212,250,105,.28);
    }

    .unlock-form .btn {
      width: 100%;
    }

    .unlock-error {
      margin-top: 12px;
      min-height: 18px;
      font-size: 11px;
      color: var(--danger);
    }

    @media(max-width: 620px) {
      .wrap {
        width: min(100% - 20px, 900px);
        padding-top: 16px;
      }

      .head {
        padding: 22px 18px;
        display: block;
      }

      .status-pill {
        display: inline-flex;
        margin-top: 14px;
      }

      .body {
        padding: 18px;
      }

      .toolbar {
        align-items: flex-start;
        flex-direction: column;
      }

      textarea {
        min-height: 52vh;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .btn {
        width: 100%;
      }

      .lock-screen {
        padding: 42px 18px 48px;
      }
    }
  </style>
</head>

<body>

  <main class="wrap">

    <div class="top">
      <a class="back" href="../../">← Ketan / Playground</a>
      <span class="badge">SIDE PROJECT / 02</span>
    </div>

    <section class="card">

      <div class="head">
        <div>
          <div class="badge">PRIVATE SHARED TOOL</div>
          <h1>Shared Clipboard</h1>
          <p class="sub">
            Access your shared clipboard across devices.
          </p>
        </div>

        <div class="status-pill">
          <span class="dot"></span>
          <span id="connectionText">Locked</span>
        </div>
      </div>

      <!-- PASSWORD SCREEN -->
      <div id="lockScreen" class="lock-screen">

        <div class="lock-icon">⌘</div>

        <h2>Clipboard locked</h2>

        <p>
          Enter your password to load the clipboard.
          Nothing is fetched from the server before successful verification.
        </p>

        <form id="unlockForm" class="unlock-form">

          <input
            id="passwordInput"
            type="password"
            autocomplete="off"
            placeholder="Enter password"
            required
          >

          <button class="btn primary" type="submit">
            Unlock <span>→</span>
          </button>

          <div id="unlockError" class="unlock-error"></div>

        </form>

      </div>

      <!-- CLIPBOARD -->
      <div id="clipboardArea" class="body hidden">

        <div class="toolbar">

          <span class="meta" id="updatedText">
            Loading clipboard…
          </span>

          <span class="meta" id="charCount">
            0 characters
          </span>

        </div>

        <textarea
          id="clipboardText"
          spellcheck="false"
          placeholder="Type or paste something here…"
        ></textarea>

        <div class="actions">

          <button
            class="btn primary"
            id="saveBtn"
            type="button"
          >
            Save <span>↗</span>
          </button>

          <button
            class="btn"
            id="copyBtn"
            type="button"
          >
            Copy
          </button>

          <button
            class="btn"
            id="refreshBtn"
            type="button"
          >
            Refresh
          </button>

          <button
            class="btn danger"
            id="clearBtn"
            type="button"
          >
            Clear
          </button>

          <button
            class="btn"
            id="lockBtn"
            type="button"
          >
            Lock
          </button>

        </div>

        <div
          class="notice"
          id="notice"
        ></div>

      </div>

    </section>

  </main>


  <script>

    const SUPABASE_URL =
      'https://wxzksezdaphewpskfbud.supabase.co';

    const SUPABASE_KEY =
      'sb_publishable_Vkeepr97HE54t4ue4vEnRg_KmALTlnL';


    /*
      SHA-256 hash only.
      Plain password is NOT stored in this file.
    */

    const OWNER_PASSWORD_HASH =
      'f2512ad315b2f4176ed3daac94b1edeab0e253eefc534a1f27a964da64652cf5';


    const lockScreen =
      document.getElementById('lockScreen');

    const clipboardArea =
      document.getElementById('clipboardArea');

    const passwordInput =
      document.getElementById('passwordInput');

    const unlockError =
      document.getElementById('unlockError');

    const textEl =
      document.getElementById('clipboardText');

    const updatedEl =
      document.getElementById('updatedText');

    const countEl =
      document.getElementById('charCount');

    const noticeEl =
      document.getElementById('notice');

    const connectionEl =
      document.getElementById('connectionText');


    let unlocked = false;
    let dirty = false;


    function headers(extra = {}) {

      return {
        apikey: SUPABASE_KEY,
        ...extra
      };

    }


    function showNotice(message, type = '') {

      noticeEl.textContent = message;

      noticeEl.className =
        'notice' + (type ? ' ' + type : '');

    }


    function setConnection(text, color) {

      connectionEl.textContent = text;

      document.querySelector('.dot').style.background =
        color;

    }


    function formatTime(value) {

      if (!value) {
        return 'Not updated yet';
      }

      return (
        'Updated ' +
        new Date(value).toLocaleString()
      );

    }


    async function sha256(value) {

      const data =
        new TextEncoder().encode(value);

      const hashBuffer =
        await crypto.subtle.digest(
          'SHA-256',
          data
        );

      return Array
        .from(new Uint8Array(hashBuffer))
        .map(
          b =>
            b
              .toString(16)
              .padStart(2, '0')
        )
        .join('');

    }


    async function verifyPassword(password) {

      const hash =
        await sha256(password);

      return hash === OWNER_PASSWORD_HASH;

    }


    async function loadClipboard(force = false) {

      if (!unlocked) {
        return;
      }

      if (dirty && !force) {
        return;
      }

      try {

        setConnection(
          'Connecting',
          '#9da6a3'
        );

        const response =
          await fetch(
            SUPABASE_URL +
            '/rest/v1/clipboard?id=eq.1&select=content,updated_at',
            {
              headers: headers()
            }
          );


        if (!response.ok) {

          throw new Error(
            'Unable to load clipboard.'
          );

        }


        const rows =
          await response.json();


        const row =
          rows[0] || {
            content: '',
            updated_at: null
          };


        textEl.value =
          row.content || '';


        countEl.textContent =
          textEl.value.length +
          ' characters';


        updatedEl.textContent =
          formatTime(
            row.updated_at
          );


        dirty = false;


        setConnection(
          'Live',
          '#7fa030'
        );


        showNotice('');

      }
      catch (error) {

        setConnection(
          'Offline',
          '#a43d32'
        );

        showNotice(
          error.message,
          'error'
        );

      }

    }


    async function writeClipboard(content) {

      if (!unlocked) {
        return;
      }


      const response =
        await fetch(
          SUPABASE_URL +
          '/rest/v1/clipboard?id=eq.1',
          {
            method: 'PATCH',

            headers: headers({
              'Content-Type':
                'application/json',

              'Prefer':
                'return=representation'
            }),

            body: JSON.stringify({
              content: content,
              updated_at:
                new Date().toISOString()
            })
          }
        );


      if (!response.ok) {

        let message =
          'Save failed.';


        try {

          const body =
            await response.json();

          if (body.message) {
            message =
              body.message;
          }

        }
        catch (_) {}


        throw new Error(
          message
        );

      }


      dirty = false;

      await loadClipboard(true);

    }


    document
      .getElementById('unlockForm')
      .addEventListener(
        'submit',
        async event => {

          event.preventDefault();


          unlockError.textContent = '';


          const password =
            passwordInput.value;


          const valid =
            await verifyPassword(
              password
            );


          passwordInput.value = '';


          if (!valid) {

            unlockError.textContent =
              'Incorrect password.';

            return;

          }


          unlocked = true;


          lockScreen.classList.add(
            'hidden'
          );


          clipboardArea.classList.remove(
            'hidden'
          );


          setConnection(
            'Connecting',
            '#9da6a3'
          );


          await loadClipboard(true);

        }
      );


    document
      .getElementById('saveBtn')
      .addEventListener(
        'click',
        async () => {

          try {

            showNotice(
              'Saving…'
            );


            await writeClipboard(
              textEl.value
            );


            showNotice(
              'Clipboard saved.',
              'ok'
            );

          }
          catch (error) {

            showNotice(
              error.message,
              'error'
            );

          }

        }
      );


    document
      .getElementById('clearBtn')
      .addEventListener(
        'click',
        async () => {

          try {

            showNotice(
              'Clearing…'
            );


            await writeClipboard(
              ''
            );


            showNotice(
              'Clipboard cleared.',
              'ok'
            );

          }
          catch (error) {

            showNotice(
              error.message,
              'error'
            );

          }

        }
      );


    document
      .getElementById('refreshBtn')
      .addEventListener(
        'click',
        async () => {

          dirty = false;

          await loadClipboard(true);

          showNotice(
            'Clipboard refreshed.',
            'ok'
          );

        }
      );


    document
      .getElementById('copyBtn')
      .addEventListener(
        'click',
        async () => {

          try {

            await navigator.clipboard.writeText(
              textEl.value
            );


            showNotice(
              'Copied to this device clipboard.',
              'ok'
            );

          }
          catch (_) {

            textEl.select();

            document.execCommand(
              'copy'
            );


            showNotice(
              'Copied to this device clipboard.',
              'ok'
            );

          }

        }
      );


    document
      .getElementById('lockBtn')
      .addEventListener(
        'click',
        () => {

          unlocked = false;

          dirty = false;

          textEl.value = '';

          countEl.textContent =
            '0 characters';

          updatedEl.textContent =
            'Locked';


          clipboardArea.classList.add(
            'hidden'
          );


          lockScreen.classList.remove(
            'hidden'
          );


          setConnection(
            'Locked',
            '#9da6a3'
          );


          showNotice('');

          passwordInput.focus();

        }
      );


    textEl.addEventListener(
      'input',
      () => {

        dirty = true;

        countEl.textContent =
          textEl.value.length +
          ' characters';

        showNotice(
          'Unsaved changes'
        );

      }
    );


    /*
      Auto-refresh every 5 seconds,
      but only after unlock and only
      when there are no unsaved changes.
    */

    setInterval(
      () => {

        if (
          unlocked &&
          !dirty
        ) {

          loadClipboard(false);

        }

      },
      5000
    );


    /*
      IMPORTANT:
      We intentionally DO NOT call
      loadClipboard() here.

      Nothing is fetched until the
      correct password is entered.
    */

    setConnection(
      'Locked',
      '#9da6a3'
    );

    passwordInput.focus();

  </script>

</body>
</html>
